# Builds RoidOS on GitHub's cloud Macs: downloads the upstream source
# (Leviidev/Husk, GPL-2.0-or-later), applies roidos/rebrand.py, compiles,
# and publishes RoidOS.ipa plus the source code of that exact build.
# Start it from the Actions tab (works in a phone browser).
#
# No Apple certificate or provisioning profile is used anywhere here. The IPA
# is signed ad hoc; SideStore/AltStore re-sign it with your own Apple ID.

name: Build RoidOS IPA

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream version to build (a release tag like 3.3, or main for the newest code)"
        type: string
        default: "3.3"
      publish_release:
        description: "Publish RoidOS.ipa as a GitHub Release (easy download on iPhone; needed for in-app update notices)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-roidos
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    # macos-26 ships Xcode 26 by default. The app uses iOS 26 APIs, so Xcode 16
    # (the default on macos-15) cannot build it.
    runs-on: macos-26
    timeout-minutes: 360   # GitHub's maximum for hosted runners

    steps:
      - name: Check out this repo (RoidOS changes and icons)
        uses: actions/checkout@v4

      - name: Download upstream source
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          ref: ${{ inputs.upstream_ref }}
          path: husk
          fetch-depth: 1

      - name: Apply RoidOS name, icon, screens and identifiers
        id: rebrand
        working-directory: husk
        run: |
          python3 "$GITHUB_WORKSPACE/roidos/rebrand.py" "$GITHUB_WORKSPACE/roidos/icons" \
            --repo "$GITHUB_REPOSITORY" --build "$GITHUB_RUN_NUMBER"
          # Commit the result: the build stamps its commit into the app, and this
          # commit is exactly the source that goes out with the IPA.
          git -c user.name="RoidOS build" -c user.email="roidos-build@users.noreply.github.com" \
            commit -q -a -m "RoidOS build $GITHUB_RUN_NUMBER"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" src/app/Husk/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RoidOS $VERSION from upstream ${{ inputs.upstream_ref }}, commit $(git rev-parse --short HEAD)"

      - name: Package the source code of this build
        run: |
          mkdir -p out
          git -C husk archive --format=zip --prefix=RoidOS-source/ -o "$GITHUB_WORKSPACE/out/RoidOS-source.zip" HEAD
          ls -lh out/RoidOS-source.zip

      - name: Free disk space (the dependency build is large)
        run: |
          df -h /
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet || true
          xcrun simctl delete all || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          df -h /

      - name: Select the newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # ANGLE comes from WebKit's current main branch, built with WebKit's
      # warnings-as-errors settings. Thread-safety annotations are static checks
      # only, so a mismatch between them and the runner's libc++ must not stop
      # the build: the compiled code is the same either way.
      - name: Adjust the ANGLE build for GitHub's Mac
        working-directory: husk
        run: |
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("scripts/build_angle_ios.sh")
          t = p.read_text()
          old = "OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-unguarded-availability-new' \\\n"
          new = ("OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-unguarded-availability-new"
                 " -Wno-thread-safety-attributes -Wno-thread-safety-analysis' \\\n"
                 "        GCC_TREAT_WARNINGS_AS_ERRORS=NO \\\n")
          if new in t:
              print("already adjusted")
          elif old in t:
              p.write_text(t.replace(old, new, 1)); print("ANGLE: thread-safety warnings are no longer fatal")
          else:
              sys.exit("build_angle_ios.sh changed upstream; update this step")
          PY

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu
          python3 --version
          qemu-img --version | head -1

      - name: Install Rust iOS target
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-ios

      - name: Work out cache key
        id: key
        run: echo "deps=roidos-deps-v2-${{ hashFiles('husk/scripts/**', 'husk/patches/**') }}" >> "$GITHUB_OUTPUT"

      # Reuses QEMU's dependencies, ANGLE, virglrenderer and MoltenVK from
      # earlier runs. The upstream build script skips stages whose output exists.
      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        with:
          path: husk/build/ios-arm64
          key: ${{ steps.key.outputs.deps }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.deps }}-

      - name: Build RoidOS (first run takes a few hours, later runs are faster)
        timeout-minutes: 320   # leaves time to save the cache if this runs long
        working-directory: husk
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/out/Husk.ipa"
          mv "$GITHUB_WORKSPACE/out/Husk.ipa"  "$GITHUB_WORKSPACE/out/RoidOS.ipa"
          mv "$GITHUB_WORKSPACE/out/Husk.tipa" "$GITHUB_WORKSPACE/out/RoidOS.tipa"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Check the IPA is RoidOS
        run: |
          cd "$RUNNER_TEMP"
          unzip -o -q "$GITHUB_WORKSPACE/out/RoidOS.ipa" "Payload/Husk.app/Info.plist"
          P=Payload/Husk.app/Info.plist
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" $P)
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" $P)
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" $P)
          echo "Display name: $NAME   Bundle ID: $ID   Version: $VER"
          [ "$NAME" = "RoidOS" ] && [ "$ID" = "com.roidos.app" ] && [ "$VER" = "${{ steps.rebrand.outputs.version }}" ]

      # Saved even when the build fails or times out, so the next run
      # continues from where this one stopped instead of starting over.
      - name: Check for dependencies to cache
        id: hasdeps
        if: always()
        run: |
          if [ -d husk/build/ios-arm64 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Save dependencies to cache
        if: always() && steps.hasdeps.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: husk/build/ios-arm64
          key: ${{ steps.key.outputs.deps }}-${{ github.run_id }}

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RoidOS-${{ steps.rebrand.outputs.version }}
          path: |
            out/RoidOS.ipa
            out/RoidOS.tipa
            out/RoidOS-source.zip
          retention-days: 14

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roidos-build-log-${{ github.run_number }}
          path: /tmp/husk_ipa/build.log
          if-no-files-found: ignore

      # The tag is the version number, which is what the app's update check
      # compares against its own version.
      - name: Publish GitHub Release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rebrand.outputs.version }}
          name: RoidOS ${{ steps.rebrand.outputs.version }}
          body: |
            **RoidOS.ipa** — install with SideStore or AltStore (they sign it with your Apple ID).
            **RoidOS.tipa** — for TrollStore only.
            **RoidOS-source.zip** — the complete source code of this build. RoidOS is free software under the GNU GPL-2.0-or-later; the licence text is in the zip.
          files: |
            out/RoidOS.ipa
            out/RoidOS.tipa
            out/RoidOS-source.zip
